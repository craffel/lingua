[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingua"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "omegaconf",
    "msgspec",
    "rouge-score",
    "sacrebleu",
    "sentencepiece",
    "tiktoken",
    "fsspec",
    "blobfile",
    "wandb",
    "viztracer",
    "lm-eval",
    "scipy",
    "pynvml",
    "datatrove",
    "orjson",
]

[project.optional-dependencies]
cuda = [
    "torch==2.9.0",
    "xformers",
    "ninja",
]

[tool.hatch.build.targets.wheel]
packages = ["lingua", "apps"]
