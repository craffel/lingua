dump_dir: /fsx/craffel/lingua_logs/flexitok_llama/
name: flexitok_llama
steps: 100_000
probe_freq: null
seed: 777
grad_acc_steps: 8


optim:
  lr: 1e-3
  weight_decay: 0.1
  epsilon: 1.0e-08
  scheduler: cosine
  warmup: 2000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1
  compile: true

model:
  dim: 2048
  n_layers: 25
  n_heads: 16
  weight_tying: false

data:
  root_dir: /scratch/craffel/lingua/data/flexitok/
  sources:
    # eng_Latn: 0.4
    fw_edu: 0.4
    dan_Latn: 0.0216582869670702
    swe_Latn: 0.0216359765418466
