  n_views: 2
  load_async: true
  add_eos: true
  tokenizer:
    name: huggingface
    path: meta-llama/Llama-3.2-1B

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
