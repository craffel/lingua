# # Training superset tokenizer with individual tokenizers trained on Fineweb-2-hq
# use with apps/main/configs/flexitok/llama_1b_base.yaml
# python -m lingua.stool script=apps.main.train config=["/fsx/craffel/lingua/apps/main/configs/flexitok/llama_1b_base.yaml","apps/main/configs/ablations/8k_v2_oracle.yaml"]
# python -m lingua.stool_ccdb ngpu=1 ncpu=1 nodes=1 launcher=bash script=apps.main.train config=["apps/main/configs/flexitok/llama_1b_base.yaml","apps/main/configs/ablations/8k_v2_oracle.yaml"]

dump_dir: /fsx/craffel/lingua_logs/8k_v2_oracle 
name: flexitok_8k_v2_oracle


model:
  vocab_size: 122447

checkpoint:
  path: /fsx/craffel/lingua_logs/checkpoints/8k_v2_oracle/

data:
  tokenizer:
    name: supertokenizer
    seed: 42
    superset_code_name: 8k_v2
    n_words: 122447
    
