# python -m lingua.stool script=apps.main.train config=["apps/main/configs/toksuite/toksuite_llama_1B.yaml"]
# python -m lingua.stool_ccdb script=apps.main.train time=240 launcher=bash mem=64G nodes=1 ngpu=1 ncpu=2 config=["apps/main/configs/toksuite/toksuite_llama_1B.yaml"]
name: toksuite_llama_1b
dump_dir: /fsx/craffel/toksuite/lingua_logs/meta-llama-Llama-3.2-1B/
seed: 777
grad_acc_steps: 8
gc_collect_freq: 1000
steps: 100_000

data:
  root_dir: /scratch/craffel/lingua/data/tokenizer_training/
  sources:
    fw_edu: 0.4
    cmn_Hani: 0.15
    tur_Latn: 0.15
    ita_Latn: 0.15
    fas_Arab: 0.15
  batch_size: 4
  seq_len: 4096
  n_views: 2
  seed: 42
  add_bos: true
  add_eos: true
  load_async: true
  prefetch_size: 1024
  tokenizer:
    name: huggingface
    path: meta-llama/Llama-3.2-1B

optim:
  lr: 0.001
  weight_decay: 0.1
  epsilon: 1.0e-08
  clip: 1.0
  scheduler: cosine
  warmup: 2000
  lr_min_ratio: 1.0e-06


model:
  dim: 2048
  n_layers: 25
  head_dim: null
  n_heads: 16
  seed: 42
  weight_tying: false


distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1
  compile: true
  
checkpoint:
  dump:
    every: 6000
    keep: -1
  eval:
    every: 2000
    keep: -1
  path: /fsx/craffel/toksuite/lingua_logs/meta-llama-Llama-3.2-1B/checkpoints
  init_ckpt_path: /fsx/craffel/toksuite/init_checkpoints/meta-llama-Llama-3.2-1B/model_dcp
  load_init_optimizer_state: false
  save_init_ckpt: false

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

logging:
  freq: 1

async_eval_gpus: 8
eval:
  harness:
    tasks:
    - hellaswag
    - piqa
    - arc_easy
    - arc_challenge
    - include_base_44_turkish
    - include_base_44_italian
    - include_base_44_chinese
    - belebele_pes_Arab
    - belebele_eng_Latn
    - belebele_ita_Latn
    - belebele_tur_Latn
    - belebele_zho_Hans
    - xnli_en
    - xnli_tr
    - xnli_zh
  generator:
    max_tokens: 8192
    dtype: bf16
    add_bos: False
